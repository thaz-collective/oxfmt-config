blockExoticSubdeps: true

catalog:
  '@thaz/typescript-config': 1.0.0-rc.2
  '@types/node': 24.13.3
  oxfmt: 0.62.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plugin-externalize-deps: 0.10.0
  vite-plus: 0.2.8

catalogMode: prefer
# Watch this issue: https://github.com/pnpm/pnpm/issues/11238
minimumReleaseAge: 4320 # 3 days just to be safe with the uptick of supply chain attacks

minimumReleaseAgeExclude:
  - '@thaz/typescript-config@1.0.0-rc.2'

overrides:
  vite: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
